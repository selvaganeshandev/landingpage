[project]
name = "promptmaxx-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Promptmaxx client data (mentions, gaps, SEO, content) to Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
promptmaxx-mcp = "promptmaxx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptmaxx_mcp"]
